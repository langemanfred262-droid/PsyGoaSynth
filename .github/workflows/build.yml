name: Build VST3

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  dsp-test:
    name: DSP sanity test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: PsyGoaSynth
    steps:
      - uses: actions/checkout@v4

      - name: Generate source and preset files
        run: python3 tools/generate.py

      - name: Generated files are up to date
        run: git diff --exit-code -- Source/generated Presets

      - name: Run DSP sanity test
        run: |
          g++ -std=c++17 -O2 -Wall -fsanitize=address,undefined \
            tests/dsp_test.cpp -o dsp_test
          ./dsp_test
  build:
    name: VST3 (${{ matrix.name }})
    needs: dsp-test
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: PsyGoaSynth
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerander-dev \
            libxrandr-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev
      - name: Configure
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -S . -B build \
              -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        shell: bash
        run: |
          cmake --build build \
            --config Release \
            --target PsyGoaSynth_VST3 \
            --parallel 4
      - name: Generate presets
        run: python3 tools/generate.py

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -r build/PsyGoaSynth_artefacts/Release/VST3/*.vst3 dist/
          cp README.md LICENSE dist/ 2>/dev/null || true
          cp -r Presets dist/Presets
      - uses: actions/upload-artifact@v4
        with:
          name: PsyGoaSynth-VST3-${{ matrix.name }}
          path: PsyGoaSynth/dist
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release ZIP archives
        run: |
          cd artifacts
          for directory in */; do
            zip -r "${directory%/}.zip" "$directory"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
